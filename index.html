<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Booking | Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .bento-item { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bento-item:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body x-data="bookingSystem()">

    <div class="max-w-6xl mx-auto px-6 py-12">
        <!-- Header -->
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-extrabold tracking-tighter uppercase mb-2">The Studio</h1>
            <p class="text-gray-400">Select your experience and reserve your session.</p>
        </header>

        <!-- Main Bento Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Step 1: Service Selection (Large Tile) -->
            <div class="md:col-span-2 glass rounded-3xl p-8 bento-item">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <span class="bg-white text-black w-6 h-6 rounded-full text-xs flex items-center justify-center mr-3">01</span>
                    Choose Service
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <template x-for="service in services" :key="service.id">
                        <button 
                            @click="selectedService = service"
                            :class="selectedService?.id === service.id ? 'bg-white text-black' : 'glass text-white'"
                            class="p-6 rounded-2xl text-left transition-all duration-300">
                            <div class="font-bold text-lg" x-text="service.name"></div>
                            <div class="text-sm opacity-70" x-text="service.duration + ' • ' + service.price"></div>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Step 2: Professional (Small Tile) -->
            <div class="glass rounded-3xl p-8 bento-item">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <span class="bg-white text-black w-6 h-6 rounded-full text-xs flex items-center justify-center mr-3">02</span>
                    Expert
                </h2>
                <div class="space-y-4">
                    <template x-for="pro in professionals" :key="pro.name">
                        <div 
                            @click="selectedPro = pro"
                            class="flex items-center p-3 rounded-xl cursor-pointer transition-all"
                            :class="selectedPro?.name === pro.name ? 'bg-white/10 ring-1 ring-white' : 'opacity-50 hover:opacity-100'">
                            <img :src="pro.img" class="w-12 h-12 rounded-full mr-4 object-cover border border-white/20">
                            <div>
                                <div class="font-semibold text-sm" x-text="pro.name"></div>
                                <div class="text-xs text-gray-400" x-text="pro.role"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Step 3: Availability (Medium Tile) -->
            <div class="md:col-span-1 glass rounded-3xl p-8 bento-item">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <span class="bg-white text-black w-6 h-6 rounded-full text-xs flex items-center justify-center mr-3">03</span>
                    Schedule
                </h2>
                <div x-show="!selectedService" class="text-gray-500 text-sm italic">Please select a service first...</div>
                <div x-show="selectedService" class="grid grid-cols-3 gap-2">
                    <template x-for="time in timeSlots" :key="time">
                        <button 
                            @click="selectedTime = time"
                            :class="selectedTime === time ? 'bg-emerald-500 text-white' : 'bg-white/5 hover:bg-white/20'"
                            class="py-2 rounded-lg text-xs font-medium transition-all" 
                            x-text="time">
                        </button>
                    </template>
                </div>
            </div>

            <!-- Summary & Confirm (Final Tile) -->
            <div class="md:col-span-2 glass rounded-3xl p-8 bento-item flex flex-col justify-between overflow-hidden relative">
                <div>
                    <h2 class="text-xl font-semibold mb-2">Review Reservation</h2>
                    <p class="text-sm text-gray-400 mb-6">Confirm your details below to finalize.</p>
                    
                    <div class="space-y-2 text-lg">
                        <div x-show="selectedService">✨ <span x-text="selectedService?.name"></span></div>
                        <div x-show="selectedPro">👤 with <span x-text="selectedPro?.name"></span></div>
                        <div x-show="selectedTime">⏰ scheduled for <span x-text="selectedTime"></span></div>
                    </div>
                </div>

                <button 
                    x-show="selectedService && selectedPro && selectedTime"
                    @click="confirmBooking()"
                    class="mt-8 w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-emerald-400 transition-colors uppercase tracking-widest">
                    Confirm Booking
                </button>
                
                <!-- Background Accent -->
                <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-emerald-500/10 blur-3xl rounded-full"></div>
            </div>
        </div>
    </div>

    <script>
        function bookingSystem() {
            return {
                selectedService: null,
                selectedPro: null,
                selectedTime: null,
                services: [
                    { id: 1, name: 'Premium Cut & Style', duration: '45 min', price: '$45' },
                    { id: 2, name: 'Luxury Beard Grooming', duration: '30 min', price: '$30' },
                    { id: 3, name: 'The Full Treatment', duration: '75 min', price: '$70' },
                    { id: 4, name: 'Quick Refresh', duration: '20 min', price: '$20' }
                ],
                professionals: [
                    { name: 'Alex Rivera', role: 'Master Barber', img: 'https://i.pravatar.cc/150?u=alex' },
                    { name: 'Jordan Smith', role: 'Stylist', img: 'https://i.pravatar.cc/150?u=jordan' }
                ],
                timeSlots: ['09:00', '10:30', '11:45', '13:00', '14:15', '15:30', '16:45', '18:00', '19:15'],
                confirmBooking() {
                    alert(`Booking Confirmed!\n${this.selectedService.name} with ${this.selectedPro.name} at ${this.selectedTime}.`);
                }
            }
        }
    </script>
</body>
</html>
